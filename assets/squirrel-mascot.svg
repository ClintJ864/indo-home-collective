<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Cartoon squirrel mascot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    /* Idle "alive" motion, built into this file (CSS runs even when the SVG is used as an image).
       Squirrel-like: mostly still, with quick twitchy bursts.
       --spd scales every timing (set by the page's JS when inlined: 0.6 fast, 1 normal, 1.6 slow). */
    .tail{transform-box:view-box; transform-origin:100px 185px; animation:tail calc(3.6s * var(--spd, 1)) ease-in-out infinite;}
    .head{transform-box:view-box; transform-origin:132px 118px; animation:head calc(5.2s * var(--spd, 1)) cubic-bezier(.3,0,.2,1) infinite;}
    .blink{transform-box:view-box; transform-origin:153px 75px; animation:blink calc(4.3s * var(--spd, 1)) infinite;}
    .nose{transform-box:view-box; transform-origin:188px 92px; animation:nose calc(.9s * var(--spd, 1)) steps(2) infinite;}
    .ear{transform-box:view-box; transform-origin:160px 52px; animation:ear calc(6.7s * var(--spd, 1)) infinite;}
    .paws{transform-box:view-box; transform-origin:150px 135px; animation:nibble calc(5.2s * var(--spd, 1)) infinite;}
    @keyframes tail{0%,100%{transform:rotate(0)} 30%{transform:rotate(-3deg)} 45%{transform:rotate(5deg)} 50%{transform:rotate(-2deg)} 55%{transform:rotate(4deg)} 75%{transform:rotate(1deg)}}
    @keyframes head{0%,18%{transform:rotate(0)} 20%,38%{transform:rotate(-7deg)} 40%,58%{transform:rotate(3deg) translateY(-1px)} 60%,100%{transform:rotate(0)}}
    @keyframes blink{0%,90%,96%,100%{transform:scaleY(1)} 93%{transform:scaleY(0.1)}}
    @keyframes nose{0%{transform:translateY(0)} 100%{transform:translateY(-0.8px)}}
    @keyframes ear{0%,80%,88%,100%{transform:rotate(0)} 82%{transform:rotate(-12deg)} 85%{transform:rotate(4deg)}}
    @keyframes nibble{0%,60%,100%{transform:translateY(0)} 64%,72%,80%{transform:translate(2px,-5px) rotate(-4deg)} 68%,76%,84%{transform:translate(0,-1px)}}
    @media (prefers-reduced-motion:reduce){.tail,.head,.blink,.nose,.ear,.paws{animation:none}}
  </style>
  <defs>
    <radialGradient id="gFur" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#9a8050"/>
      <stop offset="0.6" stop-color="#76603a"/>
      <stop offset="1" stop-color="#4f3e25"/>
    </radialGradient>
    <radialGradient id="gHead" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#a08756"/>
      <stop offset="0.65" stop-color="#7a643d"/>
      <stop offset="1" stop-color="#55442a"/>
    </radialGradient>
    <linearGradient id="gTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d7449"/>
      <stop offset="1" stop-color="#4e3d24"/>
    </linearGradient>
    <radialGradient id="gBelly" cx="45%" cy="30%" r="80%">
      <stop offset="0" stop-color="#f6c07a"/>
      <stop offset="1" stop-color="#d07f3a"/>
    </radialGradient>
    <radialGradient id="gEye" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#4a3626"/>
      <stop offset="1" stop-color="#0b0806"/>
    </radialGradient>
    <!-- soft fuzzy edges + agouti speckle so it reads as fur -->
    <filter id="fur" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="fuzzy"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.09  0 0 0 0 0.05  0 0 0 1.3 -0.62" result="speck"/>
      <feComposite in="speck" in2="fuzzy" operator="in" result="speckIn"/>
      <feMerge><feMergeNode in="fuzzy"/><feMergeNode in="speckIn"/></feMerge>
    </filter>
    <filter id="tailFur" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G" result="fuzzy"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.09  0 0 0 0 0.05  0 0 0 1.3 -0.6" result="speck"/>
      <feComposite in="speck" in2="fuzzy" operator="in" result="speckIn"/>
      <feMerge><feMergeNode in="fuzzy"/><feMergeNode in="speckIn"/></feMerge>
    </filter>
  </defs>

  <g stroke="#3b2b1b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <g class="tail"><g filter="url(#tailFur)">
      <ellipse cx="90" cy="112" rx="26" ry="32" fill="#5e4a2c" stroke="none"/>
      <path d="M102 188 C60 198 26 178 20 140 C14 104 28 68 58 50 C82 36 112 42 115 63 C118 82 98 90 86 84 C74 78 64 90 66 106 C68 126 86 140 106 150 Z" fill="url(#gTail)"/>
      <path d="M34 140 C28 112 36 84 56 66 M48 152 C42 128 46 104 60 88 M74 56 C88 50 102 54 104 64" fill="none" stroke="#b49a68" stroke-width="2.2" opacity="0.85"/>
    </g></g>


    <!-- body + haunch -->
    <g filter="url(#fur)">
      <path d="M92 196 C70 190 64 160 72 136 C80 112 102 100 126 102 C150 104 162 124 160 152 C158 178 142 196 118 198 Z" fill="url(#gFur)"/>
      <path d="M118 118 C134 116 146 132 144 158 C142 180 130 192 117 190 C106 186 104 166 106 146 C107 130 110 120 118 118 Z" fill="url(#gBelly)" stroke="none"/>
      <path d="M74 168 C72 146 90 134 108 144 C124 154 120 184 101 190 C86 194 76 184 74 168 Z" fill="#6d5834"/>
    </g>

    <!-- feet -->
    <path d="M80 196 C82 188 106 186 114 194 C116 200 84 202 80 196 Z" fill="#2e241a"/>
    <path d="M132 196 C134 190 150 189 154 195 C155 200 134 201 132 196 Z" fill="#2e241a"/>

    <g class="head">
    <path d="M116 58 C110 40 118 28 128 34 C132 40 132 50 128 58 Z" fill="#6c5733"/>
    <!-- head -->
    <g filter="url(#fur)">
      <ellipse cx="142" cy="82" rx="44" ry="40" fill="url(#gHead)"/>
      <path d="M118 100 C126 118 150 124 170 112 C168 124 148 132 128 124 C120 118 116 108 118 100 Z" fill="#e5a160" stroke="none"/>
    </g>

    <g class="ear">
    <path d="M150 48 C150 28 164 20 172 30 C176 38 170 48 162 54 Z" fill="#76603a"/>
    <path d="M156 46 C156 34 163 29 167 34 C169 38 166 44 161 48 Z" fill="#e0956a" stroke="none"/>
    </g>

    <!-- light muzzle + blush -->
    <ellipse cx="174" cy="96" rx="17" ry="13.5" fill="#ab9264" stroke="none"/>
    <ellipse cx="158" cy="102" rx="9" ry="5.5" fill="#f19a95" stroke="none" opacity="0.55"/>

    <!-- big eye -->
    <g class="blink">
    <ellipse cx="152" cy="74" rx="16" ry="17" fill="#f3dcb2" stroke="none"/>
    <ellipse cx="154" cy="75" rx="12" ry="13.5" fill="url(#gEye)" stroke="#1a120c" stroke-width="1.5"/>
    <circle cx="158.5" cy="69" r="4.8" fill="#fff" stroke="none"/>
    <circle cx="149.5" cy="81" r="2.2" fill="#fff" stroke="none" opacity="0.9"/>
    </g>
    <path d="M140 62 C146 57 156 56 164 60" fill="none" stroke="#3b2b1b" stroke-width="2"/>

    <g class="nose">
    <path d="M184 89 C188 86 194 88 193 93 C192 97 187 98 184 95 C182 93 182 91 184 89 Z" fill="#2a1d14"/>
    <circle cx="188" cy="90" r="1.3" fill="#fff" stroke="none" opacity="0.8"/>
    </g>
    <!-- smile + little teeth -->
    <path d="M186 98 C186 104 180 108 174 106" fill="none" stroke-width="2"/>
    <path d="M174 106 C176 112 184 112 186 106 Z" fill="#9b3c34" stroke-width="1.6"/>
    <rect x="178.5" y="106" width="5" height="4" rx="1" fill="#fff" stroke-width="1"/>

    <!-- whiskers -->
    <path d="M186 98 L206 92 M187 101 L205 104 M185 104 L200 112" fill="none" stroke="#3b2b1b" stroke-width="1" opacity="0.7"/>
    </g>

    <g class="paws">
    <!-- acorn -->
    <g stroke-width="2">
      <ellipse cx="170" cy="134" rx="10" ry="12" fill="#d9a35b"/>
      <path d="M159 128 C160 118 180 118 181 128 Z" fill="#7a5530"/>
      <path d="M163 124 L177 124 M166 120 L174 128 M174 120 L166 128" fill="none" stroke="#5a3d20" stroke-width="1"/>
      <path d="M170 118 L171 113" fill="none"/>
      <ellipse cx="166" cy="136" rx="2.5" ry="4" fill="#f1c88a" stroke="none"/>
    </g>
    <!-- arms + little paws hugging the acorn -->
    <path d="M128 124 C138 132 150 138 160 138" fill="none" stroke-width="10"/>
    <path d="M128 124 C138 132 150 138 160 138" fill="none" stroke="#76603a" stroke-width="6.5"/>
    <path d="M156 140 C156 132 166 132 166 140 C166 146 156 147 156 140 Z" fill="#2e241a"/>
    <path d="M174 142 C174 134 184 134 184 141 C184 147 174 148 174 142 Z" fill="#2e241a"/>
    </g>
  </g>
</svg>

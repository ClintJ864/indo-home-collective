[build]
  publish = "."
  functions = "netlify/functions"

# Project/source files that sit in the publish folder but must not be served.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/.gitignore"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

# One URL for the home page.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Indexable pages are served as static copies (generated by scripts/prerender.js)
# so crawlers get real titles and content without running JavaScript. The
# site's JS then takes over. force = true so they win over index.html.
[[redirects]]
  from = "/"
  to = "/prerender/home.html"
  status = 200
  force = true
[[redirects]]
  from = "/product/timber-slat-blinds"
  to = "/prerender/product-timber-slat-blinds.html"
  status = 200
  force = true
[[redirects]]
  from = "/product/timber-slat-blinds/*"
  to = "/prerender/product-timber-slat-blinds.html"
  status = 200
  force = true
[[redirects]]
  from = "/homewares"
  to = "/prerender/homewares.html"
  status = 200
  force = true
[[redirects]]
  from = "/ordering"
  to = "/prerender/ordering.html"
  status = 200
  force = true
[[redirects]]
  from = "/about"
  to = "/prerender/about.html"
  status = 200
  force = true
[[redirects]]
  from = "/contact"
  to = "/prerender/contact.html"
  status = 200
  force = true
[[redirects]]
  from = "/lakey-peak"
  to = "/prerender/lakey-peak.html"
  status = 200
  force = true

# Every other path (cart, checkout, product pages, ...) is the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
